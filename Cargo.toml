[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

# Pinned, mutually-compatible dependency set — see docs/DESIGN.md §11.
# Declaring a dep here does not compile it; only crates that opt in pull it.
[workspace.dependencies]
# internal crates
amux-proto = { path = "crates/amux-proto" }
amux-core = { path = "crates/amux-core" }
amux-daemon = { path = "crates/amux-daemon" }
amux-tui = { path = "crates/amux-tui" }

# external
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
postcard = { version = "1", features = ["use-std"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-term = "0.3"
# Patched below: our vendored copy adds a scroll-region getter upstream lacks. See [patch].
vt100 = "0.16"
portable-pty = "0.9"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
nix = { version = "0.30", features = ["process", "fs", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
futures = "0.3"
tempfile = "3"

[package]
name = "amux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A terminal UI for multiplexing AI coding agents in isolated git worktrees."
default-run = "amux"

[[bin]]
name = "amux"
path = "src/main.rs"

[dependencies]
amux-core = { workspace = true }
amux-daemon = { workspace = true }
amux-tui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

# amux vendors vt100 0.16.2 with one addition: `Screen::scroll_region()` / `Grid::scroll_region()`.
# The reattach snapshot must restore the terminal's DECSTBM scroll region, and upstream vt100 exposes
# no way to read it — so a client rebuilding its parser from a snapshot defaulted to a full-screen
# region and scrolled differently from the daemon, corrupting the pane after an SSH reattach until
# the app next repainted. The vendored source is byte-for-byte upstream plus that getter; diffing
# against vt100 0.16.2 on crates.io shows the whole change. Drop this patch if upstream adds a getter.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
