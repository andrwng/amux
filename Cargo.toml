[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

# Pinned, mutually-compatible dependency set — see docs/DESIGN.md §11.
# Declaring a dep here does not compile it; only crates that opt in pull it.
[workspace.dependencies]
# internal crates
amux-proto = { path = "crates/amux-proto" }
amux-core = { path = "crates/amux-core" }
amux-daemon = { path = "crates/amux-daemon" }
amux-tui = { path = "crates/amux-tui" }

# external
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
postcard = { version = "1", features = ["use-std"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-term = "0.3"
# Patched below: our vendored copy adds a scroll-region getter upstream lacks. See [patch].
vt100 = "0.16"
portable-pty = "0.9"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
nix = { version = "0.30", features = ["process", "fs", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
futures = "0.3"
tempfile = "3"

[package]
name = "amux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A terminal UI for multiplexing AI coding agents in isolated git worktrees."
default-run = "amux"

[[bin]]
name = "amux"
path = "src/main.rs"

[dependencies]
amux-core = { workspace = true }
amux-daemon = { workspace = true }
amux-tui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

# amux vendors vt100 0.16.2 with two changes vs. crates.io (diff against 0.16.2 shows both):
#  1. Added getters `Screen`/`Grid::scroll_region()` and `origin_mode()`. The reattach snapshot must
#     restore the terminal's DECSTBM scroll region and DECOM origin mode; upstream exposes no way to
#     read them, so a client rebuilding its parser from a snapshot defaulted to a full-screen region
#     and scrolled differently from the daemon, corrupting the pane after an SSH reattach.
#  2. `Grid::set_size` keeps the BOTTOM rows on a row-shrink (dropping the oldest off the top into
#     scrollback), where upstream truncates the tail and keeps the top. A pane re-attached into a
#     smaller slot (large main → small split) is resized down and snapshotted immediately; upstream's
#     keep-top left the visible area blank (a full-screen app's recent output + prompt live at the
#     bottom) and an idle diff-renderer never repainted it — a permanent blank. Keep-bottom matches
#     real terminals. Guard: `pty::tests::shrinking_the_grid_keeps_the_most_recent_rows`.
# Drop each change if upstream adds the equivalent.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
